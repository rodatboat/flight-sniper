version: '3.9'

services:
  flight-sniper:
    build: .
    container_name: flight-sniper
    shm_size: "2gb"
    volumes:
      - ./output:/output
    environment:
      PYTHONUNBUFFERED: 1
      # Output directory for flight data (default: /output in container)
      FLIGHT_SNIPER_OUTPUT_DIR: /output
      # Schedule interval in hours (default: 1 hour)
      FLIGHT_SNIPER_SCHEDULE_HOURS: 1
    restart: unless-stopped